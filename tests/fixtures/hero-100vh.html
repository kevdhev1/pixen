<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hero 100vh</title>
    <style>
      body { margin: 0; font-family: sans-serif; }
      .hero {
        height: 100vh;
        background: #4f46e5;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .hero h1 { font-size: 3rem; margin: 0; }
      .content {
        height: 2000px;
        padding: 2rem;
        background: #f3f4f6;
      }
    </style>
  </head>
  <body>
    <div class="hero"><h1>Hero 100vh</h1></div>
    <div class="content"><p>Content below the hero.</p></div>
  </body>
</html>
