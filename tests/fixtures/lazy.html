<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lazy fixture</title>
    <style>
      body { font-family: sans-serif; margin: 0; }
      .spacer { height: 200vh; background: #f3f4f6; }
      img { display: block; margin: 20px; }
    </style>
  </head>
  <body>
    <h1>Lazy loading fixture</h1>
    <p>Scroll down to trigger lazy image loading.</p>
    <div class="spacer"></div>
    <img src="/img/tiny.png" alt="lazy 1" loading="lazy" width="100" height="100" />
    <div class="spacer"></div>
    <img src="/img/tiny.png" alt="lazy 2" loading="lazy" width="100" height="100" />
    <div class="spacer"></div>
    <img src="/img/tiny.png" alt="lazy 3" loading="lazy" width="100" height="100" />
  </body>
</html>
